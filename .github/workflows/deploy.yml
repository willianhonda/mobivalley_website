name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  # Weekly App Store sync: new apps, versions, ratings, screenshots and
  # privacy labels. Commits data/ and public/apps/ only when something changed.
  schedule:
    - cron: "0 9 * * 1" # Mondays, 06:00 in Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci

      - name: Sync with the App Store
        if: github.event_name != 'push'
        run: npm run apps:sync

      - name: Commit synced data
        id: commit
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain data public/apps)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/apps
          git commit -m "chore: sync App Store data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    # Scheduled runs only redeploy when the App Store data changed.
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
